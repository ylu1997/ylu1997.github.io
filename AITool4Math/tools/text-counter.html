<div style="padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <div style="margin-bottom: 20px;">
      <label for="textInput" style="display: block; margin-bottom: 10px; font-weight: 500; color: #2c3e50;">
          输入文本：
      </label>
      <textarea 
          id="textInput" 
          placeholder="在此输入您要统计的文本..." 
          style="width: 100%; height: 200px; padding: 15px; border: 2px solid #e9ecef; border-radius: 8px; font-size: 14px; line-height: 1.5; resize: vertical; font-family: inherit;"
          oninput="updateStats()"
      ></textarea>
  </div>
  
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
      <div style="background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%); color: white; padding: 20px; border-radius: 10px; text-align: center;">
          <div style="font-size: 24px; font-weight: bold; margin-bottom: 5px;" id="charCount">0</div>
          <div style="font-size: 14px; opacity: 0.9;">字符数</div>
      </div>
      
      <div style="background: linear-gradient(135deg, #00b894 0%, #00a085 100%); color: white; padding: 20px; border-radius: 10px; text-align: center;">
          <div style="font-size: 24px; font-weight: bold; margin-bottom: 5px;" id="charCountNoSpaces">0</div>
          <div style="font-size: 14px; opacity: 0.9;">字符数(不含空格)</div>
      </div>
      
      <div style="background: linear-gradient(135deg, #fd79a8 0%, #e84393 100%); color: white; padding: 20px; border-radius: 10px; text-align: center;">
          <div style="font-size: 24px; font-weight: bold; margin-bottom: 5px;" id="wordCount">0</div>
          <div style="font-size: 14px; opacity: 0.9;">单词数</div>
      </div>
      
      <div style="background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%); color: white; padding: 20px; border-radius: 10px; text-align: center;">
          <div style="font-size: 24px; font-weight: bold; margin-bottom: 5px;" id="lineCount">0</div>
          <div style="font-size: 14px; opacity: 0.9;">行数</div>
      </div>
  </div>
  
  <div style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; border-left: 4px solid #00b894;">
      <h4 style="margin: 0 0 10px 0; color: #2c3e50;">统计说明：</h4>
      <ul style="margin: 0; padding-left: 20px; color: #555; line-height: 1.6;">
          <li>字符数：包含所有字符（包括空格、标点符号等）</li>
          <li>字符数(不含空格)：不包含空格的字符总数</li>
          <li>单词数：以空格、换行符等分隔的单词数量</li>
          <li>行数：文本的总行数</li>
      </ul>
  </div>
</div>

<script>
function updateStats() {
  const text = document.getElementById('textInput').value;
  
  // 字符数（包含空格）
  const charCount = text.length;
  document.getElementById('charCount').textContent = charCount;
  
  // 字符数（不含空格）
  const charCountNoSpaces = text.replace(/\s/g, '').length;
  document.getElementById('charCountNoSpaces').textContent = charCountNoSpaces;
  
  // 单词数
  const wordCount = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
  document.getElementById('wordCount').textContent = wordCount;
  
  // 行数
  const lineCount = text === '' ? 0 : text.split('\n').length;
  document.getElementById('lineCount').textContent = lineCount;
}

// 初始化
updateStats();
</script>
