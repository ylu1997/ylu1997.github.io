<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e1bee7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="quotaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcc02;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="enhancedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">
    Gemini API 客户端封装架构
  </text>
  
  <!-- BaseGenAI 基础层 -->
  <rect x="50" y="60" width="700" height="90" rx="10" fill="url(#baseGrad)" stroke="#1976d2" stroke-width="2"/>
  <text x="70" y="85" font-size="16" font-weight="bold" fill="#1976d2">BaseGenAI (基础API封装)</text>
  <text x="70" y="105" font-size="12" fill="#333">• 初始化Gemini客户端和模型配置</text>
  <text x="70" y="120" font-size="12" fill="#333">• 核心generate_text()方法</text>
  <text x="70" y="135" font-size="12" fill="#333">• 彩色状态信息输出</text>
  
  <!-- LoggedGenAI 日志层 -->
  <rect x="50" y="170" width="700" height="120" rx="10" fill="url(#logGrad)" stroke="#7b1fa2" stroke-width="2"/>
  <text x="70" y="195" font-size="16" font-weight="bold" fill="#7b1fa2">LoggedGenAI (日志记录)</text>
  <text x="70" y="215" font-size="12" fill="#333">• 创建唯一会话ID和日志文件</text>
  <text x="70" y="230" font-size="12" fill="#333">• JSON格式记录请求/响应/元数据</text>
  <text x="70" y="245" font-size="12" fill="#333">• 对话历史管理和会话统计</text>
  <text x="70" y="260" font-size="12" fill="#333">• 程序退出时自动闭合日志文件</text>
  <text x="70" y="275" font-size="12" fill="#333">• 支持手动关闭会话和清空历史</text>
  
  <!-- QuotaControlledGenAI 配额控制层 -->
  <rect x="50" y="310" width="700" height="120" rx="10" fill="url(#quotaGrad)" stroke="#f57c00" stroke-width="2"/>
  <text x="70" y="335" font-size="16" font-weight="bold" fill="#f57c00">QuotaControlledGenAI (配额监控)</text>
  <text x="70" y="355" font-size="12" fill="#333">• 多模型RPM/TPM/RPD限制管理</text>
  <text x="70" y="370" font-size="12" fill="#333">• 智能延迟(基础+动态调整)</text>
  <text x="70" y="385" font-size="12" fill="#333">• Token消耗估算和实际统计</text>
  <text x="70" y="400" font-size="12" fill="#333">• 独立配额日志文件</text>
  <text x="70" y="415" font-size="12" fill="#333">• 配额警告(80%阈值)和状态查询</text>
  
  <!-- EnhancedGenAI 增强层 -->
  <rect x="50" y="450" width="700" height="120" rx="10" fill="url(#enhancedGrad)" stroke="#388e3c" stroke-width="2"/>
  <text x="70" y="475" font-size="16" font-weight="bold" fill="#388e3c">EnhancedGenAI (智能增强)</text>
  <text x="70" y="495" font-size="12" fill="#333">• 错误分类(客户端4xx/服务器5xx/网络错误)</text>
  <text x="70" y="510" font-size="12" fill="#333">• 指数退避重试机制(最多30秒)</text>
  <text x="70" y="525" font-size="12" fill="#333">• 参数验证和自动修正</text>
  <text x="70" y="540" font-size="12" fill="#333">• 模型回退策略</text>
  <text x="70" y="555" font-size="12" fill="#333">• 详细错误解决方案提示</text>
  
  <!-- 继承关系箭头 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  
  <!-- 箭头线条 -->
  <line x1="400" y1="150" x2="400" y2="170" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="290" x2="400" y2="310" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="430" x2="400" y2="450" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 继承标签 -->
  <text x="410" y="165" font-size="10" fill="#666">继承</text>
  <text x="410" y="305" font-size="10" fill="#666">继承</text>
  <text x="410" y="445" font-size="10" fill="#666">继承</text>
</svg>