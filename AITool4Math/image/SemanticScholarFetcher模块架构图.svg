<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="citationGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcc02;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="smartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8bbd9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="650" fill="#fafafa"/>
  
  <!-- 标题 -->
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">
    SemanticScholarFetcher 模块架构
  </text>
  
  <!-- 核心类 -->
  <rect x="50" y="60" width="800" height="60" rx="10" fill="url(#coreGrad)" stroke="#1976d2" stroke-width="2"/>
  <text x="70" y="85" font-size="16" font-weight="bold" fill="#1976d2">SemanticScholarFetcher</text>
  <text x="70" y="105" font-size="12" fill="#333">• API密钥管理 • 统一响应处理 • 智能限流控制 • 指数退避重试</text>
  
  <!-- 论文信息获取模块 -->
  <rect x="50" y="140" width="400" height="120" rx="8" fill="url(#paperGrad)" stroke="#388e3c" stroke-width="2"/>
  <text x="60" y="165" font-size="14" font-weight="bold" fill="#388e3c">📄 论文信息获取</text>
  <text x="60" y="185" font-size="11" fill="#333">get_papers_batch()</text>
  <text x="60" y="200" font-size="10" fill="#666">• 批量获取论文详情(标题/摘要/作者)</text>
  <text x="60" y="215" font-size="10" fill="#666">• 自动分批处理(默认499篇/批)</text>
  <text x="60" y="230" font-size="11" fill="#333">get_papers_citation_counts()</text>
  <text x="60" y="245" font-size="10" fill="#666">• 批量获取被引用数统计</text>
  
  <!-- 引用关系获取模块 -->
  <rect x="470" y="140" width="380" height="120" rx="8" fill="url(#citationGrad)" stroke="#f57c00" stroke-width="2"/>
  <text x="480" y="165" font-size="14" font-weight="bold" fill="#f57c00">🔗 引用关系获取</text>
  <text x="480" y="185" font-size="11" fill="#333">get_citation_ids()</text>
  <text x="480" y="200" font-size="10" fill="#666">• 获取单个论文的所有引用ID</text>
  <text x="480" y="215" font-size="11" fill="#333">get_citations_batch()</text>
  <text x="480" y="230" font-size="10" fill="#666">• 逐个获取多个论文引用关系</text>
  <text x="480" y="245" font-size="10" fill="#666">• 支持自定义请求间隔</text>
  
  <!-- 智能优化核心 -->
  <rect x="50" y="280" width="800" height="100" rx="10" fill="url(#smartGrad)" stroke="#c2185b" stroke-width="3"/>
  <text x="70" y="305" font-size="16" font-weight="bold" fill="#c2185b">🧠 get_citations_batch_smart() - 智能优化核心</text>
  <text x="70" y="325" font-size="12" fill="#333">1. 预获取被引用数 → 2. 智能分组策略 → 3. 自适应执行</text>
  <text x="70" y="345" font-size="11" fill="#333">• 高引用论文(>400)：单独获取避免超时</text>
  <text x="70" y="360" font-size="11" fill="#333">• 低引用论文：批量获取提高效率</text>
  <text x="70" y="375" font-size="11" fill="#333">• 动态分组：总引用数不超过阈值</text>
  
  <!-- 智能策略流程图 -->
  <rect x="50" y="400" width="800" height="140" rx="8" fill="#fff" stroke="#c2185b" stroke-width="2"/>
  <text x="60" y="420" font-size="14" font-weight="bold" fill="#c2185b">智能分组策略流程</text>
  
  <!-- 流程步骤 -->
  <rect x="70" y="430" width="120" height="40" rx="5" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="130" y="445" text-anchor="middle" font-size="10" fill="#1976d2">获取被引用数</text>
  <text x="130" y="458" text-anchor="middle" font-size="9" fill="#666">citation_counts</text>
  
  <rect x="220" y="430" width="120" height="40" rx="5" fill="#fff3e0" stroke="#f57c00"/>
  <text x="280" y="445" text-anchor="middle" font-size="10" fill="#f57c00">判断阈值</text>
  <text x="280" y="458" text-anchor="middle" font-size="9" fill="#666">threshold=400</text>
  
  <rect x="370" y="400" width="120" height="40" rx="5" fill="#ffebee" stroke="#d32f2f"/>
  <text x="430" y="415" text-anchor="middle" font-size="10" fill="#d32f2f">高引用论文</text>
  <text x="430" y="428" text-anchor="middle" font-size="9" fill="#666">单独获取</text>
  
  <rect x="370" y="460" width="120" height="40" rx="5" fill="#e8f5e8" stroke="#388e3c"/>
  <text x="430" y="475" text-anchor="middle" font-size="10" fill="#388e3c">低引用论文</text>
  <text x="430" y="488" text-anchor="middle" font-size="9" fill="#666">批量分组</text>
  
  <rect x="520" y="430" width="120" height="40" rx="5" fill="#f3e5f5" stroke="#7b1fa2"/>
  <text x="580" y="445" text-anchor="middle" font-size="10" fill="#7b1fa2">执行获取</text>
  <text x="580" y="458" text-anchor="middle" font-size="9" fill="#666">并行处理</text>
  
  <!-- 箭头 -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666" />
    </marker>
  </defs>
  
  <line x1="190" y1="450" x2="220" y2="450" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="440" x2="370" y2="420" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="460" x2="370" y2="480" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="420" x2="520" y2="440" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="480" x2="520" y2="460" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- 搜索功能 -->
  <rect x="50" y="560" width="250" height="60" rx="8" fill="#fff" stroke="#666" stroke-width="1"/>
  <text x="60" y="580" font-size="12" font-weight="bold" fill="#666">🔍 search_papers_by_title()</text>
  <text x="60" y="595" font-size="10" fill="#333">• 根据标题搜索相关论文</text>
  <text x="60" y="608" font-size="10" fill="#333">• 支持限制返回数量</text>
  
  <!-- 错误处理机制 -->
  <rect x="320" y="560" width="250" height="60" rx="8" fill="#fff" stroke="#666" stroke-width="1"/>
  <text x="330" y="580" font-size="12" font-weight="bold" fill="#666">⚡ 错误处理机制</text>
  <text x="330" y="595" font-size="10" fill="#333">• 统一响应处理函数</text>
  <text x="330" y="608" font-size="10" fill="#333">• 429限流自动重试</text>
  
  <!-- 性能优化 -->
  <rect x="590" y="560" width="260" height="60" rx="8" fill="#fff" stroke="#666" stroke-width="1"/>
  <text x="600" y="580" font-size="12" font-weight="bold" fill="#666">🚀 性能优化</text>
  <text x="600" y="595" font-size="10" fill="#333">• 自动分批避免单次请求过大</text>
  <text x="600" y="608" font-size="10" fill="#333">• 智能延时和指数退避策略</text>
  
  <!-- 决策条件标注 -->
  <text x="280" y="415" text-anchor="middle" font-size="8" fill="#f57c00">count > 400?</text>
  <text x="355" y="395" font-size="8" fill="#d32f2f">Yes</text>
  <text x="355" y="505" font-size="8" fill="#388e3c">No</text>
</svg>