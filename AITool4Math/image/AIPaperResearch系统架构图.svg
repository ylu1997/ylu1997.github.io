<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcc02;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="moduleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8bbd9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="workflowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e1bee7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1000" height="800" fill="#fafafa"/>
  
  <!-- 标题 -->
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">
    AIPaperResearch 智能论文研究系统架构
  </text>
  
  <!-- 核心类 AIPaperResearch -->
  <rect x="50" y="60" width="900" height="80" rx="10" fill="url(#coreGrad)" stroke="#388e3c" stroke-width="3"/>
  <text x="70" y="85" font-size="18" font-weight="bold" fill="#388e3c">🧠 AIPaperResearch</text>
  <text x="70" y="105" font-size="12" fill="#333">• 智能论文研究系统 • 深度遍历引用网络 • AI评分筛选 • 自动状态管理</text>
  <text x="70" y="125" font-size="12" fill="#333">• 紧急保存机制 • 多轮迭代处理 • 批量token优化 • 动态schema生成</text>
  
  <!-- Paper数据模型 -->
  <rect x="50" y="160" width="280" height="120" rx="8" fill="url(#paperGrad)" stroke="#1976d2" stroke-width="2"/>
  <text x="60" y="185" font-size="14" font-weight="bold" fill="#1976d2">📄 Paper 数据模型</text>
  <text x="60" y="205" font-size="11" fill="#333">• paper_id, title, abstract</text>
  <text x="60" y="220" font-size="11" fill="#333">• authors, year, citation_count</text>
  <text x="60" y="235" font-size="11" fill="#333">• status: PaperStatus枚举</text>
  <text x="60" y="250" font-size="11" fill="#333">• ai_evaluation, citations</text>
  <text x="60" y="265" font-size="10" fill="#666">状态流转: 未查询→已获取→已评论→已采纳→已完成</text>
  
  <!-- 外部模块集成 -->
  <rect x="350" y="160" width="300" height="120" rx="8" fill="url(#moduleGrad)" stroke="#c2185b" stroke-width="2"/>
  <text x="360" y="185" font-size="14" font-weight="bold" fill="#c2185b">🔗 外部模块集成</text>
  <text x="360" y="205" font-size="12" fill="#333">SemanticScholarFetcher</text>
  <text x="360" y="220" font-size="10" fill="#666">• 批量获取论文详情</text>
  <text x="360" y="235" font-size="10" fill="#666">• 智能引用关系获取</text>
  <text x="360" y="250" font-size="12" fill="#333">SchemaJsonGenAI</text>
  <text x="360" y="265" font-size="10" fill="#666">• 结构化AI评分 • 动态schema</text>
  
  <!-- AI评分系统 -->
  <rect x="670" y="160" width="280" height="120" rx="8" fill="url(#aiGrad)" stroke="#f57c00" stroke-width="2"/>
  <text x="680" y="185" font-size="14" font-weight="bold" fill="#f57c00">🤖 AI评分系统</text>
  <text x="680" y="205" font-size="11" fill="#333">• 动态schema构造</text>
  <text x="680" y="220" font-size="11" fill="#333">• 批量token优化</text>
  <text x="680" y="235" font-size="11" fill="#333">• 学术配置优化</text>
  <text x="680" y="250" font-size="10" fill="#666">temperature=0.2, top_p=0.95</text>
  <text x="680" y="265" font-size="10" fill="#666">comment + score 结构化输出</text>
  
  <!-- 主要工作流程 -->
  <rect x="50" y="300" width="900" height="200" rx="10" fill="url(#workflowGrad)" stroke="#7b1fa2" stroke-width="3"/>
  <text x="70" y="325" font-size="16" font-weight="bold" fill="#7b1fa2">🔄 主要工作流程 (run方法)</text>
  
  <!-- 流程步骤 -->
  <rect x="70" y="340" width="140" height="50" rx="5" fill="#fff" stroke="#1976d2" stroke-width="1.5"/>
  <text x="140" y="360" text-anchor="middle" font-size="11" fill="#1976d2" font-weight="bold">1. 获取论文详情</text>
  <text x="140" y="375" text-anchor="middle" font-size="9" fill="#666">fetch_paper_details</text>
  
  <rect x="230" y="340" width="140" height="50" rx="5" fill="#fff" stroke="#f57c00" stroke-width="1.5"/>
  <text x="300" y="360" text-anchor="middle" font-size="11" fill="#f57c00" font-weight="bold">2. AI评分评价</text>
  <text x="300" y="375" text-anchor="middle" font-size="9" fill="#666">ai_evaluate_papers</text>
  
  <rect x="390" y="340" width="140" height="50" rx="5" fill="#fff" stroke="#388e3c" stroke-width="1.5"/>
  <text x="460" y="360" text-anchor="middle" font-size="11" fill="#388e3c" font-weight="bold">3. 排序筛选</text>
  <text x="460" y="375" text-anchor="middle" font-size="9" fill="#666">rank_and_filter</text>
  
  <rect x="550" y="340" width="140" height="50" rx="5" fill="#fff" stroke="#c2185b" stroke-width="1.5"/>
  <text x="620" y="360" text-anchor="middle" font-size="11" fill="#c2185b" font-weight="bold">4. 获取引用</text>
  <text x="620" y="375" text-anchor="middle" font-size="9" fill="#666">fetch_citations</text>
  
  <rect x="710" y="340" width="140" height="50" rx="5" fill="#fff" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="780" y="360" text-anchor="middle" font-size="11" fill="#7b1fa2" font-weight="bold">5. 状态更新</text>
  <text x="780" y="375" text-anchor="middle" font-size="9" fill="#666">mark_completed</text>
  
  <!-- 循环控制 -->
  <rect x="70" y="410" width="780" height="40" rx="5" fill="#e8f5e8" stroke="#388e3c" stroke-width="1"/>
  <text x="80" y="430" font-size="12" fill="#388e3c" font-weight="bold">循环控制: depth &lt; max_depth &amp;&amp; 存在未查询论文</text>
  <text x="80" y="445" font-size="10" fill="#666">每轮保存状态 → research_state_depth_{n}.json</text>
  
  <!-- 深度遍历策略 -->
  <rect x="70" y="460" width="780" height="30" rx="5" fill="#fff3e0" stroke="#f57c00" stroke-width="1"/>
  <text x="80" y="480" font-size="11" fill="#f57c00" font-weight="bold">深度遍历策略: 根论文 → 引用论文 → 二级引用 → ... (最大深度限制)</text>
  
  <!-- 箭头连接 -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666" />
    </marker>
  </defs>
  
  <line x1="210" y1="365" x2="230" y2="365" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="365" x2="390" y2="365" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="365" x2="550" y2="365" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="365" x2="710" y2="365" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- 循环箭头 -->
  <path d="M 780 390 Q 860 365 860 430 Q 860 450 140 450 Q 70 450 70 390" 
        fill="none" stroke="#388e3c" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  
  <!-- 保存机制 -->
  <rect x="50" y="520" width="440" height="120" rx="8" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="60" y="545" font-size="14" font-weight="bold" fill="#666">💾 保存机制</text>
  <text x="60" y="565" font-size="12" fill="#333">自动保存策略:</text>
  <text x="60" y="580" font-size="11" fill="#333">• 每轮结束: research_state_depth_{n}.json</text>
  <text x="60" y="595" font-size="11" fill="#333">• 最终完成: research_state_final.json</text>
  <text x="60" y="610" font-size="11" fill="#333">• 紧急保存: {auto_save_path}_emergency.json</text>
  <text x="60" y="625" font-size="10" fill="#666">包含: 未查询ID列表 + 已评论ID列表 + 所有论文详情</text>
  
  <!-- 配置参数 -->
  <rect x="510" y="520" width="440" height="120" rx="8" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="520" y="545" font-size="14" font-weight="bold" fill="#666">⚙️ 关键配置参数</text>
  <text x="520" y="565" font-size="11" fill="#333">• max_depth: 最大遍历深度 (默认4)</text>
  <text x="520" y="580" font-size="11" fill="#333">• top_k: 每轮采纳论文数 (默认30)</text>
  <text x="520" y="595" font-size="11" fill="#333">• max_input_tokens: AI输入限制 (默认3000)</text>
  <text x="520" y="610" font-size="11" fill="#333">• model_name: AI模型 (默认gemini-1.5-flash)</text>
  <text x="520" y="625" font-size="10" fill="#666">• 支持中断恢复 • 异常处理 • 进度追踪</text>
  
  <!-- 特色功能 -->
  <rect x="50" y="660" width="900" height="80" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="60" y="685" font-size="14" font-weight="bold" fill="#333">✨ 系统特色功能</text>
  <text x="60" y="705" font-size="12" fill="#333">• 智能批量处理: 动态token分配，避免API限制</text>
  <text x="60" y="720" font-size="12" fill="#333">• 状态持久化: 支持中断恢复，多轮迭代安全保障</text>
  <text x="500" y="705" font-size="12" fill="#333">• 学术专用配置: 针对学术评估优化的AI参数</text>
  <text x="500" y="720" font-size="12" fill="#333">• 深度网络遍历: 系统性探索学术引用关系网络</text>
  
  <!-- 示例应用 -->
  <rect x="50" y="760" width="900" height="30" rx="5" fill="#e8f5e8" stroke="#388e3c" stroke-width="1"/>
  <text x="60" y="780" font-size="11" fill="#388e3c" font-weight="bold">
    示例应用: Newton-Okounkov体研究 → 从种子论文开始 → 智能筛选相关文献 → 构建研究知识图谱
  </text>
</svg>