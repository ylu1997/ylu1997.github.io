<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="analysisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="filterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcc02;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="statsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8bbd9;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666" />
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="600" fill="#fafafa"/>
  
  <!-- 标题 -->
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">
    结果分析系统 - JSON输出后处理工具
  </text>
  
  <!-- 主要功能模块 -->
  <rect x="50" y="60" width="800" height="70" rx="10" fill="url(#analysisGrad)" stroke="#388e3c" stroke-width="3"/>
  <text x="70" y="85" font-size="16" font-weight="bold" fill="#388e3c">📊 Result Analysis System</text>
  <text x="70" y="105" font-size="12" fill="#333">从AIPaperResearch输出的JSON文件中筛选、分析和展示论文结果</text>
  <text x="70" y="120" font-size="12" fill="#333">支持评分范围筛选、详细信息展示、统计分析</text>
  
  <!-- 输入源 -->
  <rect x="50" y="150" width="250" height="80" rx="8" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="60" y="175" font-size="14" font-weight="bold" fill="#666">📁 输入数据源</text>
  <text x="60" y="195" font-size="11" fill="#333">• research_state_final.json</text>
  <text x="60" y="210" font-size="11" fill="#333">• emergency.json</text>
  <text x="60" y="225" font-size="10" fill="#666">包含all_papers数组和完整论文信息</text>
  
  <!-- 核心筛选功能 -->
  <rect x="320" y="150" width="280" height="80" rx="8" fill="url(#filterGrad)" stroke="#1976d2" stroke-width="2"/>
  <text x="330" y="175" font-size="14" font-weight="bold" fill="#1976d2">🔍 核心筛选功能</text>
  <text x="330" y="195" font-size="12" fill="#333">print_filtered_papers_from_emergency()</text>
  <text x="330" y="210" font-size="10" fill="#666">• 评分范围筛选: min_score &lt; score ≤ threshold</text>
  <text x="330" y="225" font-size="10" fill="#666">• 降序排列 • 详细信息控制</text>
  
  <!-- 输出展示 -->
  <rect x="620" y="150" width="230" height="80" rx="8" fill="url(#outputGrad)" stroke="#f57c00" stroke-width="2"/>
  <text x="630" y="175" font-size="14" font-weight="bold" fill="#f57c00">📋 输出展示</text>
  <text x="630" y="195" font-size="11" fill="#333">• 格式化论文列表</text>
  <text x="630" y="210" font-size="11" fill="#333">• 可选详细信息</text>
  <text x="630" y="225" font-size="11" fill="#333">• 统计摘要</text>
  
  <!-- 筛选逻辑流程 -->
  <rect x="50" y="250" width="800" height="120" rx="10" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <text x="70" y="275" font-size="16" font-weight="bold" fill="#333">🔄 筛选处理流程</text>
  
  <!-- 流程步骤 -->
  <rect x="70" y="290" width="120" height="40" rx="5" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="130" y="305" text-anchor="middle" font-size="10" fill="#1976d2">读取JSON</text>
  <text x="130" y="318" text-anchor="middle" font-size="9" fill="#666">解析all_papers</text>
  
  <rect x="210" y="290" width="120" height="40" rx="5" fill="#fff3e0" stroke="#f57c00"/>
  <text x="270" y="305" text-anchor="middle" font-size="10" fill="#f57c00">评分筛选</text>
  <text x="270" y="318" text-anchor="middle" font-size="9" fill="#666">min &lt; score ≤ max</text>
  
  <rect x="350" y="290" width="120" height="40" rx="5" fill="#e8f5e8" stroke="#388e3c"/>
  <text x="410" y="305" text-anchor="middle" font-size="10" fill="#388e3c">排序处理</text>
  <text x="410" y="318" text-anchor="middle" font-size="9" fill="#666">按评分降序</text>
  
  <rect x="490" y="290" width="120" height="40" rx="5" fill="#fce4ec" stroke="#c2185b"/>
  <text x="550" y="305" text-anchor="middle" font-size="10" fill="#c2185b">格式化输出</text>
  <text x="550" y="318" text-anchor="middle" font-size="9" fill="#666">详细信息展示</text>
  
  <rect x="630" y="290" width="120" height="40" rx="5" fill="#f3e5f5" stroke="#7b1fa2"/>
  <text x="690" y="305" text-anchor="middle" font-size="10" fill="#7b1fa2">统计分析</text>
  <text x="690" y="318" text-anchor="middle" font-size="9" fill="#666">平均/最值</text>
  
  <!-- 箭头连接 -->
  <line x1="190" y1="310" x2="210" y2="310" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="310" x2="350" y2="310" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="310" x2="490" y2="310" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="310" x2="630" y2="310" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- 筛选条件详情 -->
  <rect x="70" y="340" width="680" height="25" rx="5" fill="#e8f5e8" stroke="#388e3c" stroke-width="1"/>
  <text x="80" y="357" font-size="11" fill="#388e3c" font-weight="bold">
    筛选条件: 必须有AI评分 AND min_score &lt; ai_evaluation.score ≤ score_threshold
  </text>
  
  <!-- 输出信息详情 -->
  <rect x="50" y="390" width="800" height="140" rx="8" fill="url(#outputGrad)" stroke="#f57c00" stroke-width="2"/>
  <text x="60" y="415" font-size="14" font-weight="bold" fill="#f57c00">📄 详细输出信息</text>
  
  <!-- 基础信息 -->
  <rect x="70" y="430" width="180" height="90" rx="5" fill="#fff" stroke="#666" stroke-width="1"/>
  <text x="80" y="450" font-size="12" font-weight="bold" fill="#333">基础信息</text>
  <text x="80" y="465" font-size="10" fill="#333">• 评分 (score)</text>
  <text x="80" y="478" font-size="10" fill="#333">• 论文ID (paper_id)</text>
  <text x="80" y="491" font-size="10" fill="#333">• 标题 (title)</text>
  <text x="80" y="504" font-size="10" fill="#333">• AI评论 (comment)</text>
  
  <!-- 详细信息 -->
  <rect x="270" y="430" width="180" height="90" rx="5" fill="#fff" stroke="#666" stroke-width="1"/>
  <text x="280" y="450" font-size="12" font-weight="bold" fill="#333">详细信息</text>
  <text x="280" y="465" font-size="10" fill="#333">• 作者列表 (authors)</text>
  <text x="280" y="478" font-size="10" fill="#333">• 发表年份 (year)</text>
  <text x="280" y="491" font-size="10" fill="#333">• 引用数量 (citation_count)</text>
  <text x="280" y="504" font-size="10" fill="#333">• 处理状态 (status)</text>
  
  <!-- 摘要预览 -->
  <rect x="470" y="430" width="160" height="90" rx="5" fill="#fff" stroke="#666" stroke-width="1"/>
  <text x="480" y="450" font-size="12" font-weight="bold" fill="#333">摘要预览</text>
  <text x="480" y="465" font-size="10" fill="#333">• 前200字符</text>
  <text x="480" y="478" font-size="10" fill="#333">• 超长自动截断</text>
  <text x="480" y="491" font-size="10" fill="#333">• 添加省略号</text>
  <text x="480" y="504" font-size="9" fill="#666">可通过参数控制</text>
  
  <!-- 统计信息 -->
  <rect x="650" y="430" width="150" height="90" rx="5" fill="url(#statsGrad)" stroke="#c2185b" stroke-width="1"/>
  <text x="660" y="450" font-size="12" font-weight="bold" fill="#c2185b">统计信息</text>
  <text x="660" y="465" font-size="10" fill="#333">• 平均评分</text>
  <text x="660" y="478" font-size="10" fill="#333">• 最高评分</text>
  <text x="660" y="491" font-size="10" fill="#333">• 最低评分</text>
  <text x="660" y="504" font-size="10" fill="#333">• 论文数量</text>
  
  <!-- 使用示例 -->
  <rect x="50" y="550" width="800" height="40" rx="8" fill="#f0f0f0" stroke="#333" stroke-width="1"/>
  <text x="60" y="570" font-size="12" font-weight="bold" fill="#333">💡 使用示例</text>
  <text x="60" y="585" font-size="11" fill="#333">
    print_papers_by_score_range("research_state_final.json", min_score=70, max_score=100)
  </text>
</svg>